<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- `viewport-fit=cover` so the phone layout can paint under the notch and
         the home bar. Page zoom is left ON: the viewer takes its own pinch
         already (`touch-action: none` on the canvas — dolly on the pose tool,
         size on the effect tool), so the browser's gesture only survives where
         it is wanted, over the sheets of text. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070a12">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Workbench — Mech Brawler</title>
    <link rel="icon" href="../favicon-32x32.png">
    <link rel="stylesheet" href="workbench.css">
  </head>
  <body>
    <!--
      Both tools render into this one node; router.js picks which by `?edit=`.
      The shell is empty on purpose — each tool owns its whole layout, and a
      skeleton here would be a third place either of them could be wrong.
    -->
    <div id="app"><p class="muted boot">booting…</p></div>
    <script type="module" src="router.js"></script>
  </body>
</html>
