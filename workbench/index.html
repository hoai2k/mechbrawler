<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sprite Workbench — JJK Brawler II</title>
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="stylesheet" href="workbench.css">
  </head>
  <body>
    <header class="bar">
      <strong id="wbTitle">Sprite Workbench</strong>
      <span class="hint">Renders through the game's own sprite pipeline — what you see is what the game draws.</span>
      <nav class="modes">
        <a id="modeSprites" href="./">Sprites</a>
        <a id="modeActions" href="./?edit=actions">Actions</a>
      </nav>
      <span class="history">
        <button id="undoBtn" class="ghost sm" title="Undo (Cmd/Ctrl+Z)">↶ Undo</button>
        <button id="redoBtn" class="ghost sm" title="Redo (Cmd/Ctrl+Shift+Z)">↷ Redo</button>
      </span>
      <span id="loadState" class="loading">loading assets…</span>
    </header>

    <main id="actionsView" hidden></main>

    <main class="layout" id="spriteView">
      <!-- ---------------------------------------------------------- stage -->
      <section class="stage-col">
        <div class="stage-fit">
          <div class="stage-wrap">
            <canvas id="stage" width="1040" height="660"></canvas>
            <div id="frameTag" class="frame-tag">—</div>
          </div>
        </div>

        <div class="row">
          <div class="group grow">
            <label>Viewer zoom <span class="sub" id="zoomVal">1.9×</span></label>
            <input type="range" id="zoomRange" min="0.6" max="5" step="0.05" value="1.9">
          </div>
          <div class="group">
            <label>Background</label>
            <div id="bgSwatches" class="swatches"></div>
          </div>
        </div>

        <div class="group" id="referenceGroup">
          <label data-help="&lt;b&gt;Comparison&lt;/b&gt; fills the slot at the left end of the platform, and what stands there is the question you are asking.&lt;br&gt;&lt;br&gt;&lt;b&gt;Gojo&lt;/b&gt; is the roster size reference — how big this pose reads against everyone else, the way it does in a match. &lt;b&gt;Idle pose&lt;/b&gt; is the same question within one sprite set: is this pose the right size for this character. &lt;b&gt;Overlay idle pose&lt;/b&gt; asks it the other way, putting a faint copy of the idle underneath rather than beside — the only setting with nothing in the slot. &lt;b&gt;Alternate sprite&lt;/b&gt; stands the pose&apos;s other drawing there, which is the question a delivery asks: is the new one better.&lt;br&gt;&lt;br&gt;Whatever stands in the slot is drawn normally, not ghosted. While a secondary action is being previewed the slot shows that action&apos;s &lt;em&gt;saved&lt;/em&gt; sprite instead, so a reassignment reads as before and after.&lt;br&gt;&lt;br&gt;Spin preview rotates the pose about its centre of mass, exactly as the game does for tumbles, rolls and leans — an anchor in the wrong place makes the body orbit instead of turn.">Comparison</label>
          <div class="chips">
            <label class="chip chip--select">Show
              <!-- Idle pose by default: the question asked of nearly every pose
                   is "is this the right size for this character", and standing
                   their own idle in the slot answers it without anyone turning
                   it on. setChar/setRecent move it to suit the list opened. -->
              <select id="selfIdleMode">
                <option value="hide">None</option>
                <option value="gojo">Gojo</option>
                <option value="comparison" selected>Idle pose</option>
                <option value="overlay">Overlay idle pose</option>
                <!-- Only offered when this pose has another drawing to show —
                     but once chosen it stays chosen, and a pose without one
                     says so in the comparison slot. See
                     refreshSelfIdleOptions(). -->
                <option value="alternate" hidden>Alternate sprite</option>
              </select>
            </label>
            <!-- Only on a pose with more than one drawing to choose between. -->
            <button id="altPick" class="ghost sm" hidden type="button"
                    title="Compare against a different one of this pose's drawings">Change alternate</button>
            <label class="chip"><input type="checkbox" id="showGuides" checked> Guides</label>
            <label class="chip"><input type="checkbox" id="showBox"> Sprite bounds</label>
            <label class="chip"><input type="checkbox" id="showHurtbox" checked> Hurtbox</label>
            <label class="chip"><input type="checkbox" id="showAnchors" checked> Centre of mass</label>
            <label class="chip"><input type="checkbox" id="spinPreview"> Spin preview</label>
          </div>
        </div>
      </section>

      <!-- --------------------------------------------------------- panel -->
      <section class="panel">
        <div class="group">
          <label for="charSel" data-help="A character, or one of the three entries that are not characters: an &lt;b&gt;actor&lt;/b&gt; owns a full sprite set but has no kit (Mahoraga), &lt;b&gt;Other Sprites&lt;/b&gt; is the shared effect and summon art, and &lt;b&gt;All Recently Updated Poses&lt;/b&gt; is a cross-character work list.&lt;br&gt;&lt;br&gt;That last one collects the poses a delivery landed on top of previous work — a redraw rolls the hand tuning back, so those poses have to be done again, and after a round they are scattered across the roster. Selecting one switches to its character underneath, so everything in this panel goes on editing the real thing.">Character</label>
          <select id="charSel"></select>
        </div>

        <!-- Character, then the pose grid, then everything about the pose that
             grid selects. The three notices below used to sit above the grid,
             which put a wall of explanation between picking a character and
             picking a pose — and described a sprite you had not chosen yet. -->
        <div class="group">
          <label data-help="These filter on what is &lt;b&gt;saved in the codebase&lt;/b&gt;, not on what you have done since the page loaded.&lt;br&gt;&lt;br&gt;&lt;b&gt;No saved edits&lt;/b&gt; is the working view: poses the game draws that nobody has committed an adjustment for yet — a to-do list. Editing one does &lt;em&gt;not&lt;/em&gt; remove it from this list; it moves only once your export has been applied and the page reloaded.&lt;br&gt;&lt;br&gt;&lt;b&gt;Has saved edits&lt;/b&gt; is the other half, &lt;b&gt;Used in game&lt;/b&gt; drops the filter entirely, and &lt;b&gt;All&lt;/b&gt; adds the sheet cells the game never draws.&lt;br&gt;&lt;br&gt;The yellow dot is the separate question: what you have changed this session and not exported yet. A flagged pose is marked separately again, and a red &lt;b&gt;&#9888;&lt;/b&gt; in the corner of a cell means &lt;b&gt;new art is already on order for that pose&lt;/b&gt; — it is still editable, but the replacement is measured from scratch when it lands, so placing it today is optional.">Pose <span class="sub" id="poseCount"></span></label>
          <select id="viewSel"></select>
          <div id="poseList" class="pose-list"></div>
        </div>

        <!-- Only shown on a pose whose art was replaced under previous work. It
             is the one piece of history the panel carries, and it is the reason
             the pose is on the updated list. -->
        <details class="group expando" id="updatedGroup" hidden>
          <summary data-help="Intake stamps a pose when it writes new art over one that already had work on it, recording when the art landed and which hand-tuned numbers were rolled back. That stamp is what &lt;b&gt;All Recently Updated Poses&lt;/b&gt; lists.&lt;br&gt;&lt;br&gt;It clears itself: adjusting the pose takes it off the list, because being retuned is the whole point of being on it. &lt;b&gt;Mark reviewed&lt;/b&gt; is for the other outcome — the new art needed nothing — and travels with the export like any other change.">Updated art <span class="sub" id="updatedVal"></span></summary>
          <div id="updatedInfo" class="note"></div>
        </details>

        <!-- Shown on a pose tools/auto_tune.py placed. It is NOT an edit: the
             tuner only replaces numbers the pipeline derived, so the pose is
             still one nobody has looked at and stays on every to-do list. -->
        <!-- Shown only while a delivered replacement is waiting to be let into
             the game. This is the confirm step: until one of these buttons is
             pressed the pose goes on drawing the art it already had. -->
        <div class="group approval" id="approvalGroup" hidden>
          <label data-help="Since the roster finished, an intake round no longer overwrites art the moment it runs. A replacement lands beside the drawing it replaces and the pose keeps pointing at the old one, so nothing players see changes until somebody stands the two side by side and picks.&lt;br&gt;&lt;br&gt;&lt;b&gt;Approve&lt;/b&gt; swaps the art over, bringing that image's own placement with it. &lt;b&gt;Keep the current art&lt;/b&gt; leaves the pose exactly as it is. Either answer takes it off the updated list; both travel with the export like any other change.&lt;br&gt;&lt;br&gt;A brand-new pose never waits here — there is nothing to compare it against."><span id="approvalLabel">Replacement waiting</span> <span class="sub" id="approvalState">not in the game yet</span></label>
          <!-- The question, while there is one. -->
          <div id="approvalAsk">
            <div id="approvalInfo" class="note"></div>
            <div class="chips">
              <button id="approveBtn" class="primary sm">Approve — use the new art</button>
              <button id="keepBtn" class="ghost sm">Keep the current art</button>
            </div>
          </div>
          <!-- And what was answered, with the other answer still on offer:
               both drawings stay banked on the pose, so the decision is one
               you can go back and forth on. -->
          <div id="approvalDone" hidden>
            <div id="approvalDoneInfo" class="note"></div>
            <div class="chips">
              <button id="approvalSwitch" class="ghost sm">Change the decision</button>
            </div>
          </div>
        </div>

        <details class="group expando" id="autoTunedGroup" hidden>
          <summary data-help="&lt;b&gt;tools/auto_tune.py&lt;/b&gt; applies the placement corrections that are mechanical — the ones measured to be wrong in a consistent direction across every hand tuning ever committed (docs/sprite-auto-adjust.md). Today that is the ground contact, the horizontal centring, and the size of the ten animation states the whole roster sizes identically.&lt;br&gt;&lt;br&gt;It never touches a field you have edited, and it does &lt;em&gt;not&lt;/em&gt; count as an edit: a tuned pose stays on &lt;b&gt;No saved edits&lt;/b&gt; and on the updated list, because a rule cannot tell you whether this particular drawing looks right.">Auto-placed <span class="sub">not an edit</span></summary>
          <div id="autoTunedInfo" class="note"></div>
        </details>

        <div class="group" id="scaleGroup">
          <label data-help="This pose&apos;s own size, as a percentage of the art as delivered. It affects &lt;em&gt;this pose only&lt;/em&gt; — including the idle, which is a pose like any other here.&lt;br&gt;&lt;br&gt;To resize the whole character, use &lt;b&gt;Character height&lt;/b&gt; further down: that is the one control the whole sprite set is solved from.">Size <span class="sub" id="scaleVal"></span></label>
          <div class="slider-row">
            <input type="range" id="scaleRange" min="0.4" max="2.2" step="0.005" value="1">
            <input type="number" id="scaleNum" class="num" step="0.1" inputmode="decimal" aria-label="Size, percent of delivered">
            <span class="unit">%</span>
          </div>
        </div>

        <div class="group" id="groundGroup">
          <label data-help="Where the sprite sits vertically. On a grounded pose that is the floor contact: it defaults to the lowest opaque pixel, which is wrong when perspective puts one foot lower than the standing plane — raise it so the &lt;em&gt;near&lt;/em&gt; foot rests on the platform.&lt;br&gt;&lt;br&gt;An airborne pose has no floor contact, but it still has to sit right against the &lt;b&gt;hurtbox&lt;/b&gt; — that is the body the game actually tests, and it does not move when the fighter leaves the ground. So the control stays live there and reads as plain vertical placement; turn on the hurtbox overlay and line the pose up inside it.&lt;br&gt;&lt;br&gt;The track covers the usual range; a pose that needs more can have the number typed in and the slider grows to reach it.">Vertical position <span class="sub" id="groundVal"></span></label>
          <div class="slider-row">
            <input type="range" id="groundRange" min="-360" max="360" step="0.5" value="0">
            <input type="number" id="groundNum" class="num" step="0.5" inputmode="decimal" aria-label="Vertical position, pixels">
            <span class="unit">px</span>
          </div>
        </div>

        <div class="group" id="offsetGroup">
          <label>Horizontal position <span class="sub" id="offsetVal"></span></label>
          <div class="slider-row">
            <input type="range" id="offsetRange" min="-120" max="120" step="0.5" value="0">
            <input type="number" id="offsetNum" class="num" step="0.5" inputmode="decimal" aria-label="Horizontal position, pixels">
            <span class="unit">px</span>
          </div>
        </div>

        <div class="group" id="rotationGroup">
          <label data-help="Tilts the pose about its &lt;b&gt;centre of mass&lt;/b&gt; — the same pivot the game turns it about, so a corrected pose stays corrected through every lean, swing and tumble.&lt;br&gt;&lt;br&gt;This is for art drawn off square, not for animation: the game adds its own rotation on top of whatever is set here. Positive tilts clockwise, and the tilt mirrors with the sprite when the fighter turns around.">Rotation <span class="sub" id="rotationVal"></span></label>
          <div class="slider-row">
            <input type="range" id="rotationRange" min="-30" max="30" step="0.5" value="0">
            <input type="number" id="rotationNum" class="num" step="0.5" inputmode="decimal" aria-label="Rotation, degrees">
            <span class="unit">°</span>
          </div>
        </div>

        <!-- Directly under the sliders on purpose. Up beside the "Updated art"
             explanation it read as a remark about the round; here it sits at
             the end of the controls that act on the selected pose, which is
             what it does too. -->
        <div class="group" id="updatedClearGroup" hidden>
          <button id="updatedClear" class="ghost">Mark reviewed — take it off the updated list</button>
        </div>

        <div class="group">
          <label data-help="Marks this pose&apos;s &lt;em&gt;drawing&lt;/em&gt; as wrong — wrong enough that nothing can be edited into the right picture and it has to be drawn again. This is the ask that goes out as an asset request.&lt;br&gt;&lt;br&gt;The dropdown says &lt;em&gt;why&lt;/em&gt;, which is what the request is written from: &lt;b&gt;Quality&lt;/b&gt; is a rough, malformed or off-model drawing, &lt;b&gt;Pose&lt;/b&gt; is art that reads poorly or is not the action it stands for, &lt;b&gt;Character&lt;/b&gt; is a likeness or costume that is off, &lt;b&gt;Delete variant&lt;/b&gt; — offered only where a pose has more than one drawing — throws this one away rather than redrawing it.&lt;br&gt;&lt;br&gt;If the drawing is fine and only the FILE is wrong — a bad key, a bad crop — that is &lt;b&gt;Improvement&lt;/b&gt; below, and nobody has to redraw anything.&lt;br&gt;&lt;br&gt;It exports with everything else; flagged poses are collected into the asset request list, and clearing happens automatically when the new art is imported.">Artwork <span class="sub" id="replaceVal"></span></label>
          <div class="chips">
            <label class="chip"><input type="checkbox" id="replaceBox"> Sprite needs replacement</label>
          </div>
          <select id="replaceKind" hidden></select>
          <textarea id="replaceNote" class="note-input" hidden rows="2"
                    placeholder="What is wrong with it? (optional)"></textarea>
        </div>

        <div class="group">
          <label data-help="The drawing is right and the &lt;em&gt;file&lt;/em&gt; is wrong. This is work on the existing sprite, done in-repo — no redraw, no request, no waiting on a round.&lt;br&gt;&lt;br&gt;&lt;b&gt;Fix alpha&lt;/b&gt; is bad transparency or hard edges, &lt;b&gt;Fix crop&lt;/b&gt; is wrong framing or bounds, &lt;b&gt;Fix bleed&lt;/b&gt; is colour past the silhouette — the usual leftover of a key screen that was not flat.&lt;br&gt;&lt;br&gt;Each kind also says what survives if art does land on the pose: a re-key keeps every measurement, a re-crop moves the bounds and shifts the anchors with them.&lt;br&gt;&lt;br&gt;Independent of the replacement flag, though a pose being redrawn has little use for a fix to the drawing it is replacing.">Improvement <span class="sub" id="improveVal"></span></label>
          <div class="chips">
            <label class="chip"><input type="checkbox" id="improveBox"> Fix this sprite’s file</label>
          </div>
          <select id="improveKind" hidden></select>
          <textarea id="improveNote" class="note-input" hidden rows="2"
                    placeholder="What is wrong with the file? (optional)"></textarea>
        </div>

        <div class="group" id="mirrorGroup">
          <label data-help="The canvas shows the direction the game draws, facing right. The sheets are drawn facing right too, so a pose the artist drew facing &lt;em&gt;left&lt;/em&gt; needs mirroring — tick this and it will face the way the fighter is moving in a match.">Facing <span class="sub" id="mirrorVal"></span></label>
          <div class="chips">
            <label class="chip"><input type="checkbox" id="mirrorBox"> Mirror this pose</label>
          </div>
        </div>

        <!-- Placement sits ABOVE the anchors: it is what a pass through a
             character actually touches on every pose, so it should not be
             below a box whose height varies with how many anchors a pose has.
             Each slider is paired with the number it sets, which is editable —
             a value read off one pose can be typed into the next. -->
        <div class="group" id="usageGroup" hidden>
          <label data-help="These sprites are not part of any character&apos;s sheet: they are the shared &lt;code&gt;effect:&lt;/code&gt; and &lt;code&gt;summon:&lt;/code&gt; art the game draws for techniques, shikigami and stage props.&lt;br&gt;&lt;br&gt;They carry no per-frame placement data — the code that spawns each one decides its size and position — so the placement controls do not apply and are hidden. What you can do here is look at them at their in-game size and flag the ones that need redrawing.">Where it is used</label>
          <div id="usageInfo" class="note"></div>
        </div>







        <div class="group" id="anchorGroup">
          <label id="anchorLabel" data-help="Named points in the artwork&apos;s own pixels, so they ride along with any later size, ground-contact or horizontal change.&lt;br&gt;&lt;br&gt;&lt;b&gt;Centre of mass&lt;/b&gt; is the pivot every rotation turns about. It is hidden on poses the game never turns — the specials, the ultimate and the victory pose are drawn square — and shown on everything else. Tick &lt;b&gt;Place it anyway&lt;/b&gt; if you want it: a special thrown in mid-air still picks up the airborne lean, and setting a Rotation on any pose makes the pivot matter immediately.">Anchors <span class="sub" id="anchorNote"></span></label>
          <div id="anchorRows"></div>
          <div class="chips" id="anchorForceRow" hidden>
            <label class="chip" title="Show a centre of mass on this pose even though the game never turns it"><input type="checkbox" id="anchorForce"> Place a centre of mass anyway</label>
          </div>
        </div>

        <div class="group" id="heightGroup">
          <label data-help="The fighter&apos;s &lt;em&gt;global&lt;/em&gt; size: every pose is drawn at a scale solved from this, so moving it resizes the whole sprite set at once. The bar on the canvas is where the top of the head lands.&lt;br&gt;&lt;br&gt;Defaults to the character&apos;s canon height (&lt;code&gt;heightCm&lt;/code&gt; in characters.js), compressed toward Gojo so the roster keeps its real ordering without outgrowing the shared hurtbox. Fighters with no published height sit at Gojo&apos;s. Reset returns to the canon-derived value.&lt;br&gt;&lt;br&gt;The scale is solved against the idle&apos;s span. Once the idle has been adjusted by hand that span is pinned, so the idle becomes an ordinary pose and can be sized and grounded freely — the bar on the canvas is then the character&apos;s target rather than a line the idle is glued to.">Character height <span class="sub" id="headVal"></span></label>
          <input type="range" id="headRange" min="110" max="240" step="0.5" value="175">
          <button id="resetHead" class="ghost">Reset to canon height</button>
        </div>

        <div class="group" id="secondaryGroup">
          <label data-help="The 17 original fighters came from 4×5 sprite &lt;em&gt;sheets&lt;/em&gt;, so one cell often has to serve several actions at once — Maki&apos;s sprint cell is her dash, her dodge, her jab and her neutral special.&lt;br&gt;&lt;br&gt;The pose list names each cell after the action it was drawn as. This section lists the &lt;b&gt;other&lt;/b&gt; actions — the ones borrowing a sprite that belongs to something else — and lets you point each at a different sprite, including the unused cells the sheets left over.&lt;br&gt;&lt;br&gt;A change here is a &lt;em&gt;mapping&lt;/em&gt;, not art: it exports alongside the pose adjustments and is applied to the manifest, so characters.js does not have to change. ↺ puts an action back to the sprite the kit gives it.">Secondary actions <span class="sub" id="secondaryCount"></span></label>
          <div id="actionRows" class="action-rows"></div>
        </div>

        <div class="group" id="resetGroup">
          <button id="resetFrame" class="ghost">Reset this pose</button>
          <button id="resetChar" class="ghost">Reset character</button>
        </div>

        <div class="group">
          <label>Changes <span class="sub" id="dirtyCount">none</span></label>
          <button id="exportBtn" class="primary">Export all adjustments (downloads a file)</button>
          <textarea id="exportOut" rows="9" spellcheck="false"
                    placeholder="Adjust poses on any number of characters, then press Export once. The JSON downloads as a file and is also shown here to read or copy."></textarea>
          <button id="copyBtn" class="ghost">Copy to clipboard</button>
        </div>
      </section>
        </main>

    <!-- Sprite picker: opened from a secondary action, closes on choice. The
         tiles are drawn from the real sprites, since choosing what an action
         looks like is a visual decision. -->
    <div id="spritePicker" class="picker-modal" hidden>
      <div class="picker-backdrop" data-close></div>
      <div class="picker-panel" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
        <header>
          <div>
            <strong id="pickerTitle">Choose a sprite</strong>
            <span class="sub" id="pickerSub"></span>
          </div>
          <button id="pickerClose" class="ghost sm" type="button" data-close>Close</button>
        </header>
        <p class="note">Click a sprite to use it · hover to see it larger · right-click for more</p>
        <div id="pickerGrid" class="picker-grid"></div>
      </div>
      <div id="pickerPreview" class="picker-preview" hidden>
        <canvas id="pickerPreviewCanvas" width="420" height="460"></canvas>
        <span id="pickerPreviewLabel"></span>
      </div>
    </div>


    <!-- Two workbenches share this shell: the sprite editor (default) and the
         action player (?edit=actions). Only the requested one is kept in the
         DOM, so each module owns its ids outright. -->
    <script type="module">
      const params = new URLSearchParams(location.search);
      const char = params.get("char");
      const suffix = char ? `&char=${encodeURIComponent(char)}` : "";
      document.getElementById("modeSprites").href = `./${char ? `?char=${encodeURIComponent(char)}` : ""}`;
      document.getElementById("modeActions").href = `./?edit=actions${suffix}`;

      if (params.get("edit") === "actions") {
        document.getElementById("spriteView").remove();
        document.querySelector(".history").remove();
        document.getElementById("actionsView").hidden = false;
        document.getElementById("wbTitle").textContent = "Action Workbench";
        document.querySelector(".hint").textContent =
          "Play any action through the game's own animation data, then jump to the sprites it uses.";
        document.title = "Action Workbench — JJK Brawler II";
        document.getElementById("modeActions").classList.add("on");
        import("./actions.js");
      } else {
        document.getElementById("actionsView").remove();
        document.getElementById("modeSprites").classList.add("on");
        import("./workbench.js");
      }
    </script>
  </body>
</html>
